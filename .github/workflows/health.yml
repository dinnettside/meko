# Checks the live demo once a day through the judging period, and fails (GitHub then emails the repository's owner)
# when the start page, the feed, a saved video or the API is down, when the API no longer asks for the demo code, or
# when the language model, the web search or the voice is out of credit or running low. The API check sends no demo
# code, so it is refused before any model call; the credit check (/api/health) spends one token of each model. From
# Oct 30, 2026, the deadline, it also checks that the repository is public with its MIT license detected.
name: Health check

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://meko-kappa.vercel.app
      REPO: dinnettside/meko
    steps:
      - name: Start page
        run: curl -fsS --max-time 30 "$SITE/" | grep -q "Explainer videos you can check"
      - name: Feed
        run: curl -fsS --max-time 30 "$SITE/watch" | grep -q "sentences checked"
      - name: A saved video and its voice
        run: |
          curl -fsS --max-time 30 -o /dev/null "$SITE/examples/earthquakes.json"
          curl -fsS --max-time 30 -o /dev/null "$SITE/examples/earthquakes/scene-1.mp3"
      - name: The API is up and asks for the demo code
        run: |
          status=$(curl -s -o body.json -w "%{http_code}" --max-time 30 -X POST "$SITE/api/research" -H "Content-Type: application/json" -d '{}')
          cat body.json; echo
          test "$status" = "401" || { echo "Expected 401 without a demo code, got $status"; exit 1; }
      - name: The language model, the search and the voice have credit left
        run: |
          curl -fsS --max-time 60 "$SITE/api/health" -o health.json
          cat health.json; echo
          failed=""
          for service in models search voice; do
            state=$(jq -r ".$service" health.json)
            case "$state" in
              ok|off|unknown) ;;
              *) echo "::error::$service is $state (low: little credit left; out: none left; error: the service did not answer)"; failed=1 ;;
            esac
          done
          test -z "$failed"
      - name: The repository is public, with its MIT license detected (from the deadline on)
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261030 ]; then echo "Before the deadline: skipped."; exit 0; fi
          curl -fsS --max-time 30 "https://api.github.com/repos/$REPO" -o repo.json || { echo "::error::The repository is not public"; exit 1; }
          jq -r '"private: \(.private), license: \(.license.spdx_id)"' repo.json
          test "$(jq -r '.private' repo.json)" = "false" && test "$(jq -r '.license.spdx_id' repo.json)" = "MIT"
